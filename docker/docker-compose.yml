services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: quilt
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: /data/portfolio.db
      FMP_API_KEY: ${FMP_API_KEY:-}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      - ${QUILT_DATA:-quilt-data}:/data
    restart: unless-stopped

volumes:
  quilt-data:
